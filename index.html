<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<script src="config.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Terrain SATREL/SITENOR">
<meta name="theme-color" content="#1f4e63">
<title>Terrain SATREL/SITENOR</title>
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root{
    --bg:#f3f1ea;
    --surface:#ffffff;
    --surface-2:#eae6d8;
    --ink:#1c1a15;
    --ink-dim:#6b6558;
    --ink-faint:#948d7c;
    --line:#dcd6c4;
    --line-strong:#c7bfa8;
    --accent:#1f4e63;
    --accent-ink:#ffffff;
    --accent-soft:#dbe8ec;
    --accent-soft-ink:#163b4c;
    --ok:#2f7d4f;
    --ok-soft:#dcefe1;
    --warn:#b5451c;
    --warn-soft:#f6dfd3;
    --muted-chip:#8a8272;
    --muted-chip-soft:#e7e2d3;
    --star:#d99a1e;
    --so:#6b7385;
    --so-soft:#e6e8ee;
    --on-solid:#ffffff;
    --shadow: 0 1px 2px rgba(28,26,21,0.06), 0 6px 16px -8px rgba(28,26,21,0.18);
    --radius: 14px;
    --radius-sm: 9px;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14181a;
      --surface:#1c2225;
      --surface-2:#232a2d;
      --ink:#eef0ea;
      --ink-dim:#9aa39c;
      --ink-faint:#717b76;
      --line:#2c3336;
      --line-strong:#3a4245;
      --accent:#68b0c9;
      --accent-ink:#0d1c21;
      --accent-soft:#20343b;
      --accent-soft-ink:#a9d7e6;
      --ok:#5cbd83;
      --ok-soft:#1c3327;
      --warn:#e8875e;
      --warn-soft:#3a2419;
      --muted-chip:#8b9490;
      --muted-chip-soft:#262d2a;
    --star:#f0b54a;
    --so:#a3aabb;
    --so-soft:#2a2e38;
    --on-solid:#10161a;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
    }
  }
  :root[data-theme="dark"]{
    --bg:#14181a;
    --surface:#1c2225;
    --surface-2:#232a2d;
    --ink:#eef0ea;
    --ink-dim:#9aa39c;
    --ink-faint:#717b76;
    --line:#2c3336;
    --line-strong:#3a4245;
    --accent:#68b0c9;
    --accent-ink:#0d1c21;
    --accent-soft:#20343b;
    --accent-soft-ink:#a9d7e6;
    --ok:#5cbd83;
    --ok-soft:#1c3327;
    --warn:#e8875e;
    --warn-soft:#3a2419;
    --muted-chip:#8b9490;
    --muted-chip-soft:#262d2a;
    --star:#f0b54a;
    --so:#a3aabb;
    --so-soft:#2a2e38;
    --on-solid:#10161a;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px -10px rgba(0,0,0,0.5);
  }

  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'IBM Plex Sans', ui-sans-serif, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.display{
    font-family:'Barlow Condensed', 'IBM Plex Sans', sans-serif;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:0.02em;
    text-wrap:balance;
    margin:0;
  }
  .mono{ font-family:'IBM Plex Mono', ui-monospace, monospace; font-variant-numeric:tabular-nums; }
  button, input, textarea{ font-family:inherit; }
  input, textarea{ color:var(--ink); }
  ::selection{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  #app{
    max-width:560px;
    margin:0 auto;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    background:var(--bg);
    position:relative;
  }

  /* ---------- App bar ---------- */
  .appbar{
    position:sticky; top:0; z-index:20;
    background:var(--bg);
    padding:calc(var(--safe-area-inset-top, env(safe-area-inset-top,0px)) + 14px) 18px 12px;
    border-bottom:1px solid var(--line);
  }
  .appbar-row{ display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
  .appbar-title{ font-size:22px; line-height:1; }
  .appbar-rev{ font-size:11px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; white-space:nowrap; }
  .appbar-sub{ margin-top:4px; font-size:13px; color:var(--ink-dim); display:flex; align-items:center; gap:6px; }
  .sync-dot{ width:7px; height:7px; border-radius:50%; background:var(--muted-chip); flex:none; }
  .sync-dot.on{ background:var(--ok); }
  .progress-track{ margin-top:12px; height:4px; border-radius:99px; background:var(--surface-2); overflow:hidden; }
  .progress-fill{ height:100%; background:var(--accent); border-radius:99px; transition:width .25s ease; }

  /* ---------- Main content ---------- */
  #view{ flex:1; padding:18px 18px 12px; padding-bottom:150px; }
  .screen-title{ font-size:26px; margin-bottom:2px; }
  .screen-desc{ color:var(--ink-dim); font-size:14px; margin-bottom:18px; }

  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    box-shadow:var(--shadow);
  }
  .card + .card{ margin-top:14px; }
  .step-eyebrow{ font-size:12px; color:var(--accent); font-weight:600; letter-spacing:.08em; text-transform:uppercase; font-family:'Barlow Condensed',sans-serif; }
  .step-title{ font-size:22px; margin-top:2px; }
  .step-help{ font-size:13.5px; color:var(--ink-dim); margin-top:6px; line-height:1.45; }

  .field{ margin-top:16px; }
  .field:first-child{ margin-top:0; }
  .field label{ display:block; font-size:13.5px; font-weight:600; color:var(--ink); margin-bottom:6px; }
  .field label .req{ color:var(--warn); margin-left:2px; }
  .field input[type=text], .field input[type=date], .field textarea{
    width:100%;
    background:var(--surface-2);
    border:1px solid var(--line-strong);
    border-radius:var(--radius-sm);
    padding:11px 12px;
    font-size:15px;
    color:var(--ink);
    resize:none;
    line-height:1.4;
  }
  .field textarea{ min-height:64px; }
  .field input:focus, .field textarea:focus{
    outline:2px solid var(--accent); outline-offset:1px; background:var(--surface);
  }
  .field input.err, .field textarea.err{ border-color:var(--warn); }

  /* ---------- Grid / rating rows ---------- */
  .legend{ display:flex; gap:14px; font-size:12px; color:var(--ink-dim); margin-bottom:12px; flex-wrap:wrap; }
  .legend span{ display:inline-flex; align-items:center; gap:5px; }
  .legend i{ width:9px; height:9px; border-radius:3px; display:inline-block; }

  .item-row{ padding:14px 0; border-top:1px solid var(--line); }
  .item-row:first-of-type{ border-top:none; padding-top:0; }
  .item-label{ font-size:14.5px; line-height:1.4; margin-bottom:10px; }
  .pill-group{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{
    flex:1 1 0; min-width:56px;
    text-align:center;
    padding:10px 6px;
    border-radius:var(--radius-sm);
    border:1px solid var(--line-strong);
    background:var(--surface-2);
    font-size:13.5px; font-weight:600;
    color:var(--ink-dim);
    cursor:pointer;
    user-select:none;
    -webkit-tap-highlight-color:transparent;
    min-height:44px;
    display:flex; align-items:center; justify-content:center;
  }
  .pill.wide{ flex:1 1 auto; }
  .pill:active{ transform:scale(0.97); }
  /* Sélection en couleur pleine pour être bien visible sur le terrain */
  .pill.sel-c{ background:var(--ok); border-color:var(--ok); color:var(--on-solid); }
  .pill.sel-nc{ background:var(--warn); border-color:var(--warn); color:var(--on-solid); }
  .pill.sel-so{ background:var(--so); border-color:var(--so); color:var(--on-solid); }
  .pill.sel-accent{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-soft-ink); }

  .scale-row{ display:flex; gap:7px; }
  .scale-pill{
    flex:1; text-align:center; padding:10px 0; border-radius:var(--radius-sm);
    border:1px solid var(--line-strong); background:var(--surface-2);
    font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; color:var(--ink-dim);
    cursor:pointer; min-height:44px; display:flex; align-items:center; justify-content:center;
    -webkit-tap-highlight-color:transparent;
  }
  .scale-pill.sel{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  .scale-caption{ display:flex; justify-content:space-between; font-size:11px; color:var(--ink-faint); margin-top:5px; }

  /* ---------- Notation par étoiles (libellé et étoiles sur une ligne) ---------- */
  .star-item{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .star-item .item-label{ margin-bottom:0; flex:1; min-width:0; }
  .stars{ display:flex; flex:none; }
  .star{
    border:none; background:none; cursor:pointer; padding:4px 1px; line-height:1;
    font-size:27px; color:var(--line-strong); -webkit-tap-highlight-color:transparent;
    transition:color .12s ease, transform .12s ease;
  }
  .star.on{ color:var(--star); }
  .star:active{ transform:scale(0.9); }
  @media (hover:hover){
    .stars:hover .star{ color:var(--star); }
    .stars .star:hover ~ .star{ color:var(--line-strong); }
  }

  .field-desc{ font-size:12.5px; color:var(--ink-dim); margin:-3px 0 7px; line-height:1.4; }
  .other-input{ margin-top:8px; }
  .field-heading.first{ margin-top:0; padding-top:0; border-top:none; }
  .field-heading{ font-size:17px; color:var(--accent); margin:26px 0 4px; padding-top:16px; border-top:1px solid var(--line); }

  .info-block{ margin-top:14px; }
  .info-block h4{ font-family:'Barlow Condensed',sans-serif; font-size:15px; text-transform:uppercase; letter-spacing:.03em; color:var(--accent); margin:0 0 6px; }
  .info-block ul{ margin:0; padding-left:18px; font-size:13.5px; color:var(--ink-dim); line-height:1.5; }
  .info-block li{ margin-bottom:2px; }
  .info-card{ background:var(--surface-2); border-radius:var(--radius-sm); padding:14px 16px; margin-bottom:16px; }

  /* ---------- Review ---------- */
  .summary-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:16px; }
  .summary-tile{ background:var(--surface-2); border-radius:var(--radius-sm); padding:12px 8px; text-align:center; }
  .summary-tile .num{ font-family:'IBM Plex Mono',monospace; font-size:22px; font-weight:600; }
  .summary-tile .lbl{ font-size:11px; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em; margin-top:2px; }
  .summary-tile.ok .num{ color:var(--ok); }
  .summary-tile.warn .num{ color:var(--warn); }
  .summary-tile.so .num{ color:var(--so); }

  .alert{ border-radius:var(--radius-sm); padding:12px 14px; font-size:13.5px; line-height:1.5; margin-bottom:14px; }
  .alert.warn{ background:var(--warn-soft); color:var(--warn); }
  .alert.info{ background:var(--accent-soft); color:var(--accent-soft-ink); }
  .alert ul{ margin:6px 0 0; padding-left:18px; }
  .alert button.link{ background:none; border:none; padding:0; color:inherit; font-weight:600; text-decoration:underline; cursor:pointer; font-size:inherit; }

  .nc-list{ list-style:none; margin:0; padding:0; }
  .nc-list li{ display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-top:1px solid var(--line); font-size:13.5px; }
  .nc-list li:first-child{ border-top:none; }
  .nc-list .sec{ color:var(--ink-faint); font-size:11.5px; display:block; }

  /* ---------- Buttons ---------- */
  .btn{
    appearance:none; border:none; cursor:pointer;
    border-radius:var(--radius-sm);
    padding:13px 18px;
    font-size:15px; font-weight:600;
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    min-height:46px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:disabled{ opacity:.45; cursor:not-allowed; }
  .btn-ghost{ background:var(--surface-2); color:var(--ink); border:1px solid var(--line-strong); }
  .btn-block{ width:100%; }
  .btn-sm{ padding:8px 12px; font-size:13px; min-height:36px; }
  .btn-danger-ghost{ background:transparent; color:var(--warn); border:1px solid var(--warn); }

  /* ---------- Footer nav (form) ---------- */
  .stepnav{
    position:fixed; left:50%; transform:translateX(-50%);
    bottom:calc(64px + var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px))); width:100%; max-width:560px;
    background:var(--bg);
    border-top:1px solid var(--line);
    padding:10px 18px; display:flex; gap:10px; z-index:15;
  }
  .stepnav .btn{ flex:1; }

  /* ---------- Tab bar ---------- */
  .tabbar{
    position:fixed; left:50%; transform:translateX(-50%); bottom:0; width:100%; max-width:560px;
    display:flex; background:var(--surface); border-top:1px solid var(--line);
    padding-bottom:var(--safe-area-inset-bottom, env(safe-area-inset-bottom,0px));
    z-index:16;
  }
  .tab{
    flex:1; border:none; background:none; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:9px 4px 8px; color:var(--ink-faint); font-size:11px; font-weight:600;
    -webkit-tap-highlight-color:transparent;
  }
  .tab.active{ color:var(--accent); }
  .tab svg{ width:22px; height:22px; }
  .tab-badge{ position:relative; }
  .tab-badge .dot{ position:absolute; top:-2px; right:-6px; width:8px; height:8px; border-radius:50%; background:var(--warn); }

  /* ---------- Audit list ---------- */
  .banner{ border-radius:var(--radius-sm); padding:11px 14px; font-size:12.5px; margin-bottom:14px; display:flex; gap:8px; align-items:flex-start; line-height:1.4; }
  .banner.local{ background:var(--muted-chip-soft); color:var(--ink-dim); }
  .banner.team{ background:var(--ok-soft); color:var(--ok); }

  .fab-new{
    display:flex; align-items:center; justify-content:center; gap:8px;
    width:100%; padding:14px; border-radius:var(--radius);
    background:var(--accent); color:var(--accent-ink);
    font-family:'Barlow Condensed',sans-serif; font-weight:700; font-size:17px; letter-spacing:.02em; text-transform:uppercase;
    border:none; cursor:pointer; margin-bottom:18px; box-shadow:var(--shadow);
  }

  .audit-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:15px 16px; margin-bottom:11px; cursor:pointer; box-shadow:var(--shadow);
  }
  .audit-card:active{ transform:scale(0.99); }
  .audit-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .audit-chantier{ font-size:16.5px; font-weight:600; line-height:1.25; }
  .audit-client{ font-size:13px; color:var(--ink-dim); margin-top:2px; }
  .audit-meta{ display:flex; gap:12px; margin-top:10px; font-size:12px; color:var(--ink-faint); flex-wrap:wrap; }
  .audit-meta span{ display:flex; align-items:center; gap:4px; }
  .badges{ display:flex; gap:6px; flex:none; }
  .badge{ font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:600; padding:4px 8px; border-radius:99px; white-space:nowrap; }
  .badge.ok{ background:var(--ok-soft); color:var(--ok); }
  .badge.warn{ background:var(--warn-soft); color:var(--warn); }
  .badge.note{ background:var(--accent-soft); color:var(--accent-soft-ink); }

  .empty{ text-align:center; padding:50px 20px; color:var(--ink-faint); }
  .empty svg{ width:40px; height:40px; margin-bottom:10px; opacity:.6; }
  .empty p{ font-size:14px; margin:0; }

  /* ---------- Detail view ---------- */
  .detail-header{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .backbtn{ background:none; border:none; color:var(--accent); font-size:14px; font-weight:600; cursor:pointer; padding:6px 0; display:flex; align-items:center; gap:4px; }
  .detail-section-title{ font-size:16px; margin:22px 0 8px; padding-top:14px; border-top:1px solid var(--line); }
  .detail-section-title:first-of-type{ border-top:none; padding-top:0; margin-top:16px; }
  .kv-row{ display:flex; justify-content:space-between; gap:14px; padding:7px 0; font-size:13.5px; border-top:1px solid var(--line); }
  .kv-row:first-child{ border-top:none; }
  .kv-row .k{ color:var(--ink-dim); }
  .kv-row .v{ text-align:right; font-weight:500; }
  .detail-comment{ margin-top:8px; font-size:13.5px; color:var(--ink-dim); background:var(--surface-2); border-radius:var(--radius-sm); padding:10px 12px; line-height:1.5; white-space:pre-wrap; }
  .chip-status{ display:inline-flex; align-items:center; gap:5px; font-size:12.5px; font-weight:600; padding:3px 9px; border-radius:99px; }

  .toast{
    position:fixed; left:50%; transform:translateX(-50%); bottom:80px; z-index:40;
    background:var(--ink); color:var(--bg); padding:12px 18px; border-radius:99px; font-size:13.5px; font-weight:500;
    box-shadow:var(--shadow);
    animation:toastin .2s ease;
  }
  @keyframes toastin{ from{ opacity:0; transform:translate(-50%,10px);} to{ opacity:1; transform:translate(-50%,0);} }

  .modal-backdrop{ position:fixed; inset:0; z-index:60; background:rgba(20,18,14,0.45); display:flex; align-items:flex-end; justify-content:center; animation:fadein .15s ease; }
  @media (min-width:560px){ .modal-backdrop{ align-items:center; } }
  @keyframes fadein{ from{ opacity:0; } to{ opacity:1; } }
  .modal-sheet{
    background:var(--surface); border-radius:var(--radius) var(--radius) 0 0; box-shadow:var(--shadow);
    width:100%; max-width:520px; max-height:82vh; display:flex; flex-direction:column; overflow:hidden;
    animation:sheetup .18s ease;
  }
  @media (min-width:560px){ .modal-sheet{ border-radius:var(--radius); max-height:74vh; } }
  @keyframes sheetup{ from{ transform:translateY(16px); opacity:0; } to{ transform:translateY(0); opacity:1; } }
  .modal-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 16px; border-bottom:1px solid var(--line); }
  .modal-head h3{ font-family:'Barlow Condensed',sans-serif; font-size:19px; font-weight:700; letter-spacing:.2px; margin:0; }
  .modal-close{ border:none; background:var(--surface-2); color:var(--ink-dim); width:30px; height:30px; border-radius:99px; font-size:16px; line-height:1; cursor:pointer; flex:none; }
  .modal-body{ padding:12px 16px; overflow-y:auto; }
  .modal-text{
    width:100%; min-height:220px; resize:vertical; border:1px solid var(--line); border-radius:var(--radius-sm);
    background:var(--surface-2); color:var(--ink); font-family:'IBM Plex Mono',monospace; font-size:12.5px; line-height:1.55;
    padding:10px 11px; white-space:pre-wrap;
  }
  .modal-hint{ margin:8px 2px 0; font-size:12px; color:var(--ink-faint); }
  .modal-foot{ display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); }

  .photo-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; margin-bottom:12px; }
  .photo-thumb{ position:relative; border-radius:var(--radius-sm); overflow:hidden; border:1px solid var(--line-strong); background:var(--surface-2); aspect-ratio:4/3; }
  .photo-thumb img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-del{ position:absolute; top:6px; right:6px; width:30px; height:30px; border-radius:99px; border:none; background:rgba(20,18,14,.7); color:#fff; font-size:14px; cursor:pointer; }
  .photo-actions{ display:flex; flex-direction:column; gap:8px; }
  .photo-actions .btn{ width:100%; cursor:pointer; }
  .field .photo-actions label.btn{ display:inline-flex; margin:0; font-size:15px; }
  .field .photo-actions label.btn-primary{ color:var(--accent-ink); }
  .btn.is-disabled{ opacity:.45; pointer-events:none; }
  .visually-hidden{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0,0,0,0); }

  /* ---------- Chip select (checkbox / radio option lists) ---------- */
  .chipwrap{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    padding:9px 14px; border-radius:99px; border:1px solid var(--line-strong);
    background:var(--surface-2); font-size:13.5px; font-weight:500; color:var(--ink-dim);
    cursor:pointer; user-select:none; -webkit-tap-highlight-color:transparent; min-height:40px;
    display:inline-flex; align-items:center; gap:6px; line-height:1.3;
  }
  .chip.sel{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent-soft-ink); font-weight:600; }

const BAD_VALUES = new Set(['NC','Non','Mauvais','C : Insuffisant','D : Inacceptable']);
const NEUTRAL_VALUES = new Set(['SO','Sans-Objet','Non concerné','E : Sans objet']);
const isDisplayOnly = f => f.type === 'note' || f.type === 'heading';

// Champ affiché seulement si la réponse à une autre question correspond (showIf).
function isVisible(f, data){
  if(!f.showIf) return true;
  const v = (data || state)[f.showIf.key];
  return Array.isArray(v) ? v.includes(f.showIf.equals) : v === f.showIf.equals;
}
const OTHER_LABEL = 'Autre';
function fieldOptions(f){ return f.other ? f.options.concat([OTHER_LABEL]) : f.options; }
function fieldDisplay(f, data){
  const v = data[f.key];
  const one = x => (f.other && x === OTHER_LABEL) ? (data[f.key+'__autre'] ? 'Autre : ' + data[f.key+'__autre'] : 'Autre') : String(x);
  return Array.isArray(v) ? v.map(one).join(', ') : one(v);
}

function requiredMissing(){
  const missing = [];
  currentSteps().forEach((step, stepIndex) => {
    if(step.kind === 'fields'){
      step.fields.forEach(f => {
        if(!f.required || !isVisible(f)) return;
        const v = state[f.key];
        let empty;
        if(f.type === 'checkbox-options') empty = !Array.isArray(v) || v.length===0;
        else if(f.type === 'scale-inline') empty = v===undefined;
        else empty = !String(v||'').trim();
        if(empty) missing.push({ stepIndex, label:f.label });
      });
    } else if(step.kind === 'grids' && step.required){
      step.groups.forEach(g => {
        const num = (g.title.match(/^\d+/) || [''])[0];
        g.items.forEach(item => { if(state[item.key]===undefined) missing.push({ stepIndex, label:(num ? num+' — ' : '')+item.label }); });
      });
    } else if(step.kind === 'rated-list'){
      step.items.forEach(item => { if(state[item.key]===undefined) missing.push({ stepIndex, label:item.label }); });
    } else if(step.kind === 'mixed-rated'){
      step.rated.items.forEach(item => { if(state[item.key]===undefined) missing.push({ stepIndex, label:item.label }); });
    }
  });
  return missing;
}

// Conforme / à signaler / sans objet : calculé comme dans le rapport envoyé.
function statsFromPayload(form, data){
  const p = buildPayload(form, Object.assign({}, data, { _id: data._id || 'x', submittedAt: data.submittedAt || '' }));
  const badItems = [];
  p.payload.sections.forEach(sec => {
    const stepIndex = form.steps.findIndex(s => s.title === sec.title || (s.groups && s.groups.some(g => g.title === sec.title)));
    sec.rows.forEach(r => { if(r.status === 'nc') badItems.push({ section: sec.title, label: r.label, stepIndex }); });
  });
  const rate = (p.good + p.bad) > 0 ? Math.round(p.good / (p.good + p.bad) * 100) : null;
  return { good: p.good, bad: p.bad, neutral: p.neutral, rate, badItems };
}
function computeStats(){ return statsFromPayload(currentForm(), state); }
function countAnsweredSteps(){
  let done = 0;
  currentSteps().forEach(step => { if(step.kind!=='review' && stepHasAnyAnswer(step)) done++; });
  return done;
}
function stepHasAnyAnswer(step){
  if(step.kind === 'fields') return step.fields.some(f => isDisplayOnly(f) ? false : (Array.isArray(state[f.key]) ? state[f.key].length : (f.type==='scale-inline' ? state[f.key]!==undefined : String(state[f.key]||'').trim())));
  if(step.kind === 'grid') return step.items.some(item => step.exclusive ? state[item.key]!==undefined : step.options.some(o=>state[item.key+'__'+o]));
  if(step.kind === 'mixed'){
    const fieldsAnswered = step.fields.some(f => Array.isArray(state[f.key]) ? state[f.key].length : String(state[f.key]||'').trim());
    const gridAnswered = step.grid.items.some(item => state[item.key]!==undefined);
    return fieldsAnswered || gridAnswered || String(state[step.commentKey]||'').trim();
  }
  if(step.kind === 'grids') return step.groups.some(g => g.items.some(item => state[item.key]!==undefined));
  if(step.kind === 'scale') return step.items.some(item => state[item.key]!==undefined);
  if(step.kind === 'scale-single') return state[step.key]!==undefined;
  if(step.kind === 'info-scale') return state[step.scaleKey]!==undefined;
  if(step.kind === 'rated-list') return step.items.some(item => state[item.key]!==undefined);
  if(step.kind === 'mixed-rated') return step.rated.items.some(item => state[item.key]!==undefined) || step.fields.some(f => String(state[f.key]||'').trim());
  return false;
}

/* ============================================================
   SUBMISSION — envoi vers Google Sheets (script Apps Script)
   Chaque saisie part avec tous les intitulés, y compris les
   questions non renseignées (rapport PDF complet).
   ============================================================ */
function rowStatus(v){ return BAD_VALUES.has(v) ? 'nc' : NEUTRAL_VALUES.has(v) ? 'so' : 'ok'; }
function hasValue(v){ return Array.isArray(v) ? v.length > 0 : (v !== undefined && v !== null && String(v).trim() !== ''); }

function buildPayload(form, data){
  const sections = [];
  let good = 0, bad = 0, neutral = 0;
  const count = s => { if(s === 'ok') good++; else if(s === 'nc') bad++; else if(s === 'so') neutral++; };
  const disp = v => Array.isArray(v) ? v.join(', ') : String(v);

  form.steps.forEach(step => {
    const rows = [];
    const sec = { title: step.title, rows };

    const addFieldRow = f => {
      if(isDisplayOnly(f) || f.type === 'photos' || !isVisible(f, data)) return;
      const v = data[f.key];
      const row = { label: f.label, value: '' };
      if(f.type === 'textarea') row.long = true;
      if(!hasValue(v)){ row.empty = true; rows.push(row); return; }
      row.value = f.type === 'date' ? fmtDate(v) : fieldDisplay(f, data);
      if(f.checkNo){ row.status = v === 'Non' ? 'nc' : v === 'Oui' ? 'ok' : 'so'; count(row.status); }
      else if(f.status && f.status[v]){ row.status = f.status[v]; if(!f.noCount) count(row.status); }
      rows.push(row);
    };

    // Ligne de grille : choix unique (C/NC/SO, Bon/Mauvais, A à E) ou cases multiples (EPI Requis/Porté/SO).
    const addGridRow = (item, options, exclusive) => {
      let v, s;
      if(exclusive){
        v = data[item.key];
        if(v === undefined){ rows.push({ label: item.label, value: '', empty: true }); return; }
        s = rowStatus(v);
      } else {
        const sel = options.filter(o => data[item.key+'__'+o]);
        if(!sel.length){ rows.push({ label: item.label, value: '', empty: true }); return; }
        v = sel.join(' + ');
        // EPI : porté = conforme, requis mais non porté = à signaler, sinon sans objet.
        s = sel.includes('Porté') ? 'ok' : sel.includes('Requis') ? 'nc' : 'so';
      }
      count(s);
      rows.push({ label: item.label, value: v, status: s });
    };

    if(step.kind === 'fields'){
      step.fields.forEach(addFieldRow);
    } else if(step.kind === 'grid'){
      step.items.forEach(item => addGridRow(item, step.options, step.exclusive));
      (step.after || []).forEach(addFieldRow);
      sec.comment = data[step.commentKey] || '';
    } else if(step.kind === 'mixed'){
      step.fields.forEach(addFieldRow);
      step.grid.items.forEach(item => addGridRow(item, step.grid.options, step.grid.exclusive));
      sec.comment = data[step.commentKey] || '';
    } else if(step.kind === 'rated-list' || step.kind === 'mixed-rated'){
      // Notes A à E, avec observations facultatives par ligne.
      (step.kind === 'rated-list' ? step.items : step.rated.items).forEach(item => {
        addGridRow(item, null, true);
        if(item.commentKey && hasValue(data[item.commentKey])) rows.push({ label: 'Observations', value: String(data[item.commentKey]), long: true });
      });
      if(step.kind === 'mixed-rated') step.fields.forEach(addFieldRow);
    } else if(step.kind === 'scale-single' || step.kind === 'info-scale'){
      const key = step.kind === 'scale-single' ? step.key : step.scaleKey;
      const label = step.kind === 'scale-single' ? step.label : step.scaleLabel;
      const v = data[key];
      rows.push(v === undefined ? { label, value: '', empty: true } : { label, value: v + '/5', num: Number(v) });
      if(step.commentKey) sec.comment = data[step.commentKey] || '';
    } else if(step.kind === 'grids'){
      // Une étape, plusieurs grilles : chaque grille devient une section du rapport.
      step.groups.forEach(g => {
        const grows = [];
        g.items.forEach(item => {
          const v = data[item.key];
          if(v === undefined){ grows.push({ label: item.label, value: '', empty: true }); return; }
          const s = rowStatus(v);
          count(s);
          grows.push({ label: item.label, value: v, status: s });
        });
        sections.push({ title: g.title, rows: grows });
      });
      return;
    } else if(step.kind === 'scale'){
      step.items.forEach(item => {
        const v = data[item.key];
        if(v === undefined){ rows.push({ label: item.label, value: '', empty: true }); return; }
        rows.push({ label: item.label, value: v + '/5', num: Number(v), stars: !!step.stars });
      });
      sec.comment = data[step.commentKey] || '';
    }

    if(rows.length) sections.push(sec);
  });

  const pick = keys => { for(const k of keys){ if(hasValue(data[k])) return String(data[k]); } return null; };
  return {
    id: data._id,
    form_id: form.id,
    form_name: form.name,
    audit_date: pick(['date_audit','date_rex','fait_le','formalise_le']),
    chantier: pick(['chantier','designation','lieu','immatriculation']),
    client: pick(['client']),
    auteur: pick(['auditeurs','redacteur','nom_prenom','animateur']),
    good, bad, neutral,
    rate: (good + bad) > 0 ? Math.round(good / (good + bad) * 1000) / 10 : null,
    created_at: data.submittedAt,
    payload: { v: 2, sections },
  };
}

/* ---------- Photos ---------- */
function compressImage(file, maxSide, quality){
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      resolve(c.toDataURL('image/jpeg', quality));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('image illisible')); };
    img.src = url;
  });
}
async function addPhotos(key, input, max){
  const files = Array.from(input.files || []);
  input.value = '';
  const arr = Array.isArray(state[key]) ? state[key].slice() : [];
  for(const file of files){
    if(arr.length >= max){ showToast('Maximum ' + max + ' photos'); break; }
    try{ arr.push({ id: uid(), data: await compressImage(file, 1280, 0.7) }); }
    catch(e){ showToast('Photo illisible'); }
  }
  state[key] = arr; saveDraft(); render();
}
function removePhoto(key, id){
  state[key] = (Array.isArray(state[key]) ? state[key] : []).filter(p => p.id !== id);
  saveDraft(); render();
}
function renderPhotosField(f){
  const arr = Array.isArray(state[f.key]) ? state[f.key] : [];
  const full = arr.length >= f.max;
  const thumbs = arr.map(p =>
    '<div class="photo-thumb"><img src="' + p.data + '" alt="Photo">'
    + '<button type="button" class="photo-del" onclick="removePhoto(\'' + f.key + '\',\'' + p.id + '\')" aria-label="Supprimer la photo">✕</button></div>'
  ).join('');
  const dis = full ? ' disabled' : '';
  return '<div class="field"><label>' + esc(f.label) + ' <span style="color:var(--ink-faint);font-weight:400;">(' + arr.length + '/' + f.max + ')</span></label>'
    + (thumbs ? '<div class="photo-grid">' + thumbs + '</div>' : '')
    + '<div class="photo-actions">'
    + '<label class="btn btn-primary' + (full ? ' is-disabled' : '') + '">Prendre une photo'
    + '<input type="file" accept="image/*" capture="environment" class="visually-hidden"' + dis + ' onchange="addPhotos(\'' + f.key + '\',this,' + f.max + ')"></label>'
    + '<label class="btn btn-ghost' + (full ? ' is-disabled' : '') + '">Choisir dans la galerie'
    + '<input type="file" accept="image/*" multiple class="visually-hidden"' + dis + ' onchange="addPhotos(\'' + f.key + '\',this,' + f.max + ')"></label>'
    + '</div></div>';
}

async function postRecord(form, record){
  const url = (window.SITENOR_CONFIG || {}).APPS_SCRIPT_URL;
  if(!url) throw new Error('config manquante');
  const body = buildPayload(form, record);
  body.photos = (record.photos || []).filter(p => p.data).map(p => ({ id: p.id, data: p.data }));
  // Corps en text/plain : pas de pré-requête CORS, accepté par Apps Script.
  const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action: 'submit', record: body }) });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  const out = await res.json();
  if(!out.ok) throw new Error(out.error || 'refusé');
  (record.photos || []).forEach(p => { delete p.data; p.sent = true; });
}

async function submitEntry(){
  const missing = requiredMissing();
  if(missing.length){ appState.showMissing = true; render(); window.scrollTo(0,0); return; }
  appState.showMissing = false;

  const form = currentForm();
  const record = Object.assign({}, state, { _id: uid(), submittedAt: new Date().toISOString(), _status: 'sending' });

  const history = loadHistory(form.id);
  history.unshift(record);
  saveHistory(form.id, history);

  state = {}; seedDefaults();
  appState.stepIndex = 0;
  clearDraft(form.id);
  goTab('list');

  try{
    await postRecord(form, record);
    record._status = 'sent';
    showToast('Envoyé ✓ — PDF transmis au responsable');
  }catch(e){
    record._status = 'pending';
    showToast('Envoi impossible — sera renvoyé automatiquement');
  }
  const h2 = loadHistory(form.id);
  const idx = h2.findIndex(a => a._id === record._id);
  if(idx >= 0){ h2[idx] = record; saveHistory(form.id, h2); }
  render();
}

let retrying = false;
async function retryPendingAll(){
  if(retrying || !navigator.onLine) return;
  retrying = true;
  let anyChanged = false;
  for(const form of FORMS){
    const history = loadHistory(form.id);
    let changed = false;
    for(const record of history){
      if(record._status !== 'pending') continue;
      try{ await postRecord(form, record); record._status = 'sent'; changed = true; anyChanged = true; }
      catch(e){ /* still offline */ }
    }
    if(changed) saveHistory(form.id, history);
  }
  if(anyChanged) showToast('Envoi(s) en attente transmis ✓');
  retrying = false;
}
async function resendOne(id){
  const form = currentForm();
  const history = loadHistory(form.id);
  const record = history.find(a => a._id === id);
  if(!record) return;
  try{ await postRecord(form, record); record._status = 'sent'; saveHistory(form.id, history); showToast('Envoyé ✓'); render(); }
  catch(e){ showToast('Toujours hors connexion'); }
}

   ============================================================ */
const LABEL_KEY_PRIORITY = ['chantier','designation','lieu','immatriculation','nom_prenom','animateur','redacteur'];
function entryLabel(steps, data){
  for(const key of LABEL_KEY_PRIORITY){
    if(data[key]) return data[key];
  }
  for(const step of steps){
    if(step.kind==='fields'){
      const f = step.fields.find(x => x.type==='text' && data[x.key]);
      if(f) return data[f.key];
    }
  }
  return null;
}
function recordToText(form, data){
  const lines = [];
  lines.push((form.name).toUpperCase());
  lines.push('');
  form.steps.forEach(step => {
    if(step.kind === 'review') return;
    let block = [];
    if(step.kind === 'fields'){
      step.fields.forEach(f => {
        if(isDisplayOnly(f) || !isVisible(f, data)) return;
        if(f.type==='photos'){ if(Array.isArray(data[f.key]) && data[f.key].length) block.push(f.label+' : '+data[f.key].length+' photo(s)'); return; }
        if(hasValue(data[f.key])) block.push(f.label+' : '+(f.type==='date' ? fmtDate(data[f.key]) : fieldDisplay(f, data)));
      });
    } else if(step.kind === 'grid'){
      step.items.forEach(item => {
        if(step.exclusive){ const v = data[item.key]; if(v) block.push('  '+item.label+' : '+v); }
        else { const sel = step.options.filter(o=>data[item.key+'__'+o]); if(sel.length) block.push('  '+item.label+' : '+sel.join(' + ')); }
      });
      (step.after || []).forEach(f => { if(isVisible(f, data) && hasValue(data[f.key])) block.push(f.label+' : '+fieldDisplay(f, data)); });
      if(data[step.commentKey]) block.push('Commentaires : '+data[step.commentKey]);
    } else if(step.kind === 'grids'){
      step.groups.forEach(g => {
        const ls = g.items.filter(it => data[it.key]).map(it => '  '+it.label+' : '+data[it.key]);
        if(ls.length){ block.push(g.title); block.push(...ls); }
      });
    } else if(step.kind === 'mixed'){
      step.fields.forEach(f=>{ const v=data[f.key]; if(Array.isArray(v)&&v.length) block.push(f.label+' : '+v.join(', ')); });
      step.grid.items.forEach(item => { const v=data[item.key]; if(v) block.push('  '+item.label+' : '+v); });
      if(data[step.commentKey]) block.push('Commentaires : '+data[step.commentKey]);
    } else if(step.kind === 'scale'){
      step.items.forEach(item => { if(data[item.key]) block.push('  '+item.label+' : '+data[item.key]+'/5'); });
      if(data[step.commentKey]) block.push('Commentaires : '+data[step.commentKey]);
    } else if(step.kind === 'scale-single'){
      if(data[step.key]) block.push(step.label+' : '+data[step.key]+'/5');
      if(data[step.commentKey]) block.push('Commentaires : '+data[step.commentKey]);
    } else if(step.kind === 'info-scale'){
      if(data[step.scaleKey]) block.push(step.scaleLabel+' : '+data[step.scaleKey]+'/5');
    } else if(step.kind === 'rated-list'){
      step.items.forEach(item => { if(data[item.key]){ block.push('  '+item.label+' : '+data[item.key]); if(data[item.commentKey]) block.push('    → '+data[item.commentKey]); } });
    } else if(step.kind === 'mixed-rated'){
      step.rated.items.forEach(item => { if(data[item.key]){ block.push('  '+item.label+' : '+data[item.key]); if(data[item.commentKey]) block.push('    → '+data[item.commentKey]); } });
      step.fields.forEach(f => { if(data[f.key]) block.push(f.label+' : '+data[f.key]); });
    }
    if(block.length){ lines.push('--- '+step.title.toUpperCase()+' ---'); lines.push(...block); lines.push(''); }
  });
  return lines.join('\n');
}
function exportRecord(data){
  const form = currentForm();
  const text = recordToText(form, data);
  const label = entryLabel(form.steps, data) || form.name;
  const filename = (form.id+'_'+label).toString().replace(/[^a-z0-9]+/gi,'_').toLowerCase() + '_' + (data.submittedAt||'').slice(0,10) + '.txt';
  appState.textModal = { text, filename };
  render();
}
function closeExportModal(){ appState.textModal = null; render(); }
function copyExportText(){
  const tm = appState.textModal;
  if(!tm) return;
  const ta = document.getElementById('export-text-area');
  const doFallback = () => { if(ta){ ta.focus(); ta.select(); try{ document.execCommand('copy'); showToast('Copié ✓'); }catch(e){ showToast('Sélectionnez le texte puis copiez'); } } };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(tm.text).then(() => showToast('Copié ✓')).catch(doFallback);
  } else {
    doFallback();
  }
}
function renderExportModal(){
  const tm = appState.textModal;
  if(!tm) return '';
  return '<div class="modal-backdrop" onclick="if(event.target===this) closeExportModal()">'
    + '<div class="modal-sheet">'
      + '<div class="modal-head"><h3>Détail à copier</h3><button type="button" class="modal-close" onclick="closeExportModal()" aria-label="Fermer">✕</button></div>'
      + '<div class="modal-body">'
        + '<textarea id="export-text-area" class="modal-text" readonly onclick="this.focus();this.select();">'+esc(tm.text)+'</textarea>'
        + '<p class="modal-hint">Sur iPhone : appuyez dans le texte, sélectionnez tout, puis copiez ou partagez.</p>'
      + '</div>'
      + '<div class="modal-foot">'
        + '<button type="button" class="btn btn-ghost btn-block" onclick="closeExportModal()">Fermer</button>'
        + '<button type="button" class="btn btn-primary btn-block" onclick="copyExportText()">Copier</button>'
      + '</div>'
    + '</div>'
  + '</div>';
}

/* ============================================================
   RENDER HELPERS
   ============================================================ */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(iso){ if(!iso) return '—'; const parts = String(iso).split('-'); if(parts.length===3) return parts[2]+'/'+parts[1]+'/'+parts[0]; return iso; }
function fmtDateTime(iso){ if(!iso) return ''; const d = new Date(iso); if(isNaN(d)) return ''; return d.toLocaleDateString('fr-FR') + ' à ' + d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }

function renderChipSelect(f){
  const multi = f.type === 'checkbox-options';
  const val = multi ? (Array.isArray(state[f.key]) ? state[f.key] : []) : state[f.key];
  const isSel = opt => multi ? val.includes(opt) : val === opt;
  const chips = fieldOptions(f).map(opt => {
    const selected = isSel(opt);
    const handler = multi
      ? "toggleCheckboxOption('"+f.key+"', "+JSON.stringify(opt)+")"
      : "selectRadioOption('"+f.key+"', "+JSON.stringify(opt)+")";
    return '<div class="chip'+(selected?' sel':'')+'" role="button" tabindex="0" onclick="'+handler.replace(/"/g,'&quot;')+'">'+(selected?ICONS.tick:'')+esc(opt)+'</div>';
  }).join('');
  const other = (f.other && isSel(OTHER_LABEL))
    ? '<input type="text" class="other-input" placeholder="Précisez…" value="'+esc(state[f.key+'__autre'] || '')+'" oninput="onTextInput(this,\''+f.key+'__autre\')">'
    : '';
  return '<div class="chipwrap'+(f.stack?' stack':'')+'">'+chips+'</div>'+other;
}
function renderScaleInline(f){
  const val = state[f.key];
  const pills = [1,2,3,4,5].map(n => '<div class="scale-pill'+(val===n?' sel':'')+'" role="button" tabindex="0" onclick="selectScale(\''+f.key+'\','+n+')">'+n+'</div>').join('');
  return '<div class="scale-row">'+pills+'</div><div class="scale-caption"><span>1 · Faible</span><span>5 · Élevé</span></div>';
}

function renderField(f){
  if(!isVisible(f)) return '';
  const req = f.required ? '<span class="req">*</span>' : '';
  const head = '<label>'+esc(f.label)+req+'</label>' + (f.desc ? '<div class="field-desc">'+esc(f.desc)+'</div>' : '');
  if(f.type === 'note'){
    return '<div class="field" style="color:var(--ink-dim);font-size:13.5px;font-style:italic;">'+esc(f.label)+'</div>';
  }
  if(f.type === 'heading'){
    return '<h3 class="field-heading">'+esc(f.label)+'</h3>';
  }
  if(f.type === 'photos') return renderPhotosField(f);
  if(f.type === 'checkbox-options' || f.type === 'radio-options'){
    return '<div class="field">'+head+renderChipSelect(f)+'</div>';
  }
  if(f.type === 'scale-inline'){
    return '<div class="field">'+head+renderScaleInline(f)+'</div>';
  }
  const val = state[f.key]!==undefined ? state[f.key] : '';
  if(f.type === 'textarea'){
    return '<div class="field">'+head
      + '<textarea rows="1" oninput="onTextInput(this,\''+f.key+'\')" placeholder="Réponse longue">'+esc(val)+'</textarea></div>';
  }
  const type = f.type === 'date' ? 'date' : 'text';
  return '<div class="field">'+head
    + '<input type="'+type+'" value="'+esc(val)+'" oninput="onTextInput(this,\''+f.key+'\')" placeholder="'+(type==='text'?'Réponse courte':'')+'"></div>';
}

function pillClass(code, selected){
  if(!selected) return 'pill';
  const s = rowStatus(code);
  return s === 'nc' ? 'pill sel-nc' : s === 'so' ? 'pill sel-so' : 'pill sel-c';
}
function renderGridItem(item, options, exclusive, chips){
  if(chips && exclusive){
    const val = state[item.key];
    const cs = options.map(o => {
      const sel = val === o, s = rowStatus(o);
      const style = !sel ? '' : s === 'nc' ? 'background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600;'
        : s === 'so' ? 'background:var(--so-soft);border-color:var(--so);color:var(--so);font-weight:600;'
        : 'background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:600;';
      return '<div class="chip" style="'+style+'" role="button" tabindex="0" onclick="selectExclusive(\''+item.key+'\','+JSON.stringify(o).replace(/"/g,'&quot;')+')">'+(sel?ICONS.tick:'')+esc(o)+'</div>';
    }).join('');
    return '<div class="item-row"><div class="item-label">'+esc(item.label)+'</div><div class="chipwrap">'+cs+'</div></div>';
  }
  const pills = options.map(o => {
    const selected = exclusive ? state[item.key] === o : !!state[item.key+'__'+o];
    const cls = exclusive ? pillClass(o, selected) : ('pill' + (selected ? ' sel-accent' : ''));
    const handler = exclusive ? "selectExclusive('"+item.key+"','"+o+"')" : "selectCheck('"+item.key+"','"+o+"')";
    return '<div class="'+cls+'" role="button" tabindex="0" onclick="'+handler+'">'+esc(o)+'</div>';
  }).join('');
  return '<div class="item-row"><div class="item-label">'+esc(item.label)+'</div><div class="pill-group">'+pills+'</div></div>';
}
function renderGridBody(step, options, exclusive, items, commentKey, title, chips, after){
  const legend = exclusive ? '' : '<div class="legend"><span>Une ou plusieurs cases par ligne</span></div>';
  const rows = items.map(item => renderGridItem(item, options, exclusive, chips)).join('')
    + (after && after.length ? '<div style="margin-top:14px;">'+after.map(renderField).join('')+'</div>' : '');
  const titleHtml = title ? '<h4 style="font-family:\'Barlow Condensed\',sans-serif;font-size:15px;text-transform:uppercase;letter-spacing:.03em;color:var(--accent);margin:0 0 8px;">'+esc(title)+'</h4>' : '';
  const comment = commentKey ? renderField({key:commentKey, label:(step && step.commentLabel) || 'Commentaires', type:'textarea'}) : '';
  return titleHtml + legend + rows + (comment ? '<div style="margin-top:14px;">'+comment+'</div>' : '');
}
function renderScaleRow(item){
  const val = state[item.key];
  const pills = [1,2,3,4,5].map(n => '<div class="scale-pill'+(val===n?' sel':'')+'" role="button" tabindex="0" onclick="selectScale(\''+item.key+'\','+n+')">'+n+'</div>').join('');
  return '<div class="item-row"><div class="item-label">'+esc(item.label)+'</div><div class="scale-row">'+pills+'</div></div>';
}
function renderStarRow(item){
  const val = state[item.key] || 0;
  const stars = [1,2,3,4,5].map(n => '<button type="button" class="star'+(n<=val?' on':'')+'" aria-label="'+n+' étoile'+(n>1?'s':'')+'" onclick="selectScale(\''+item.key+'\','+n+')">★</button>').join('');
  return '<div class="item-row star-item"><div class="item-label">'+esc(item.label)+'</div><div class="stars" role="group">'+stars+'</div></div>';
}
function ratedPillClass(code, selected){
  if(!selected) return 'chip';
  if(code.startsWith('A')||code.startsWith('B')) return 'chip sel';
  if(code.startsWith('C')||code.startsWith('D')) return 'chip sel-nc-chip';
  return 'chip sel';
}
function renderRatedItem(item, options){
  const val = state[item.key];
  const chips = options.map(o => {
    const selected = val === o;
    let style = '';
    if(selected){
      if(o.startsWith('C')||o.startsWith('D')) style = 'background:var(--warn-soft);border-color:var(--warn);color:var(--warn);font-weight:600;';
      else if(o.startsWith('E')) style = 'background:var(--muted-chip-soft);border-color:var(--muted-chip);color:var(--muted-chip);font-weight:600;';
    }
    return '<div class="chip'+(selected?' sel':'')+'" style="'+style+'" role="button" tabindex="0" onclick="selectExclusive(\''+item.key+'\','+JSON.stringify(o).replace(/"/g,'&quot;')+')">'+(selected?ICONS.tick:'')+esc(o)+'</div>';
  }).join('');
  const comment = item.commentKey ? '<textarea rows="1" style="margin-top:8px;" oninput="onTextInput(this,\''+item.commentKey+'\')" placeholder="Observations (facultatif)">'+esc(state[item.commentKey]||'')+'</textarea>' : '';
  return '<div class="item-row"><div class="item-label">'+esc(item.label)+'</div><div class="chipwrap">'+chips+'</div>'+comment+'</div>';
}

function renderStepBody(step){
  if(step.kind === 'fields') return step.fields.map(renderField).join('');
  if(step.kind === 'grid') return renderGridBody(step, step.options, step.exclusive, step.items, step.commentKey, null, step.chips, step.after);
  if(step.kind === 'grids'){
    return step.groups.map((g, i) => '<h3 class="field-heading'+(i === 0 ? ' first' : '')+'">'+esc(g.title)+'</h3>'
      + g.items.map(item => renderGridItem(item, step.options, true, false)).join('')).join('');
  }
  if(step.kind === 'mixed'){
    const fieldsHtml = step.fields.map(renderField).join('');
    const gridHtml = renderGridBody(step, step.grid.options, step.grid.exclusive, step.grid.items, step.commentKey, step.grid.title);
    return fieldsHtml + '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">' + gridHtml + '</div>';
  }
  if(step.kind === 'scale'){
    const rows = step.items.map(step.stars ? renderStarRow : renderScaleRow).join('');
    const cap = step.stars ? '' : '<div class="scale-caption"><span>1 · Insuffisant</span><span>5 · Exemplaire</span></div>';
    const comment = renderField({key:step.commentKey, label:'Commentaires', type:'textarea'});
    return rows + cap + '<div style="margin-top:14px;">'+comment+'</div>';
  }
  if(step.kind === 'scale-single'){
    const val = state[step.key];
    const pills = [1,2,3,4,5].map(n => '<div class="scale-pill'+(val===n?' sel':'')+'" role="button" tabindex="0" onclick="selectScale(\''+step.key+'\','+n+')">'+n+'</div>').join('');
    const cap = '<div class="scale-caption"><span>1 · Insuffisant</span><span>5 · Exemplaire</span></div>';
    const comment = renderField({key:step.commentKey, label:'Commentaires', type:'textarea'});
    return '<div class="item-label" style="font-size:15px;font-weight:600;">'+esc(step.label)+'</div><div class="scale-row">'+pills+'</div>'+cap+'<div style="margin-top:16px;">'+comment+'</div>';
  }
  if(step.kind === 'info-scale'){
    const groups = step.groups.map(g => '<div class="info-block"><h4>'+esc(g.title)+'</h4><ul>'+g.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul></div>').join('');
    const val = state[step.scaleKey];
    const pills = [1,2,3,4,5].map(n => '<div class="scale-pill'+(val===n?' sel':'')+'" role="button" tabindex="0" onclick="selectScale(\''+step.scaleKey+'\','+n+')">'+n+'</div>').join('');
    const cap = '<div class="scale-caption"><span>1 · Insuffisant</span><span>5 · Exemplaire</span></div>';
    return '<div class="info-card">'+groups+'</div><div class="item-label" style="font-size:15px;font-weight:600;">'+esc(step.scaleLabel)+'</div><div class="scale-row">'+pills+'</div>'+cap;
  }
  if(step.kind === 'rated-list'){
    return step.items.map(item => renderRatedItem(item, step.options)).join('');
  }
  if(step.kind === 'mixed-rated'){
    const rated = step.rated.items.map(item => renderRatedItem(item, step.rated.options)).join('');
    const fields = step.fields.map(renderField).join('');
    return rated + '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);">' + fields + '</div>';
  }
  if(step.kind === 'review') return renderReviewBody();
  return '';
}

function renderReviewBody(){
  const missing = requiredMissing();
  const stats = computeStats();
  let html = '';

  if(missing.length){
    html += '<div class="alert warn"><strong>Informations manquantes</strong><ul>'
      + missing.map(m => '<li>'+esc(m.label)+' — <button class="link" onclick="jumpToStep('+m.stepIndex+')">compléter</button></li>').join('')
      + '</ul></div>';
  }

  if(stats.good+stats.bad+stats.neutral > 0){
    html += '<div class="summary-grid">'
      + '<div class="summary-tile ok"><div class="num mono">'+stats.good+'</div><div class="lbl">Conforme</div></div>'
      + '<div class="summary-tile warn"><div class="num mono">'+stats.bad+'</div><div class="lbl">À signaler</div></div>'
      + '<div class="summary-tile so"><div class="num mono">'+stats.neutral+'</div><div class="lbl">Sans objet</div></div>'
      + '</div>';
    if(stats.rate !== null) html += '<div class="alert info">Taux de conformité (hors sans-objet) : <strong>'+stats.rate+'%</strong></div>';
  }

  if(stats.badItems.length){
    html += '<h4 style="font-family:\'Barlow Condensed\',sans-serif;font-size:14px;text-transform:uppercase;letter-spacing:.03em;color:var(--warn);margin:16px 0 4px;">Points à signaler</h4>';
    html += '<ul class="nc-list">' + stats.badItems.map(n => '<li><span><span class="sec">'+esc(n.section)+'</span>'+esc(n.label)+'</span><button class="link" onclick="jumpToStep('+n.stepIndex+')">voir</button></li>').join('') + '</ul>';
  }
  if(!missing.length && stats.good+stats.bad+stats.neutral === 0 && !stats.badItems.length){
    html += '<div class="alert info">Vérifiez les informations ci-dessous puis envoyez.</div>';
  }

  const idLabel = entryLabel(currentSteps(), state);
  html += '<div style="margin-top:18px;padding-top:16px;border-top:1px solid var(--line);font-size:13px;color:var(--ink-dim);">'
    + (idLabel ? '<strong>'+esc(idLabel)+'</strong>' : 'Prêt à envoyer')
    + '</div>';

  return html;
}

      + '</header>';
  }
  const form = currentForm();
  if(appState.tab === 'form'){
    const steps = currentSteps();
    const step = steps[appState.stepIndex];
    const pct = Math.round(((appState.stepIndex+1) / steps.length) * 100);
    return '<header class="appbar">'
      + '<div class="appbar-row"><h1 class="appbar-title display">'+esc(form.name)+'</h1>'
      + '<button class="btn btn-ghost btn-sm" onclick="goTab(\'list\')">Fermer</button></div>'
      + '<div class="appbar-sub">'+(steps.length > 1 ? step.eyebrow+' sur '+steps.length+' · '+esc(step.title) : 'Tous les champs sur une page')+'</div>'
      + '<div class="progress-track"><div class="progress-fill" style="width:'+pct+'%"></div></div>'
      + '</header>';
  }
  if(appState.tab === 'detail'){
    return '<header class="appbar">'
      + '<button class="form-header-back" onclick="closeDetail()">'+ICONS.back+' '+esc(form.name)+'</button>'
      + '<div class="appbar-row"><h1 class="appbar-title display">Détail</h1></div></header>';
  }
  const online = navigator.onLine;
  return '<header class="appbar">'
    + '<button class="form-header-back" onclick="goHome()">'+ICONS.back+' Formulaires</button>'
    + '<div class="appbar-row"><h1 class="appbar-title display">'+esc(form.name)+'</h1><span class="appbar-rev">'+form.emoji+'</span></div>'
    + '<div class="appbar-sub"><span class="sync-dot '+(online?'on':'')+'"></span>'+(online?'Connecté':'Hors connexion')+'</div>'
    + '</header>';
}

function renderTabBar(){
  if(!appState.formId){
    return '<nav class="tabbar"><button class="tab active">'+ICONS.home+'<span>Formulaires</span></button></nav>';
  }
  const listActive = appState.tab === 'list' || appState.tab === 'detail';
  const formActive = appState.tab === 'form';
  const draftBadge = hasAnyAnswer() && !formActive ? '<span class="dot"></span>' : '';
  return '<nav class="tabbar">'
    + '<button class="tab'+(listActive?' active':'')+'" onclick="goTab(\'list\')">'+ICONS.list+'<span>Historique</span></button>'
    + '<button class="tab'+(formActive?' active':'')+' tab-badge" onclick="onTapNewEntry()">'+ICONS.plus+draftBadge+'<span>Nouveau</span></button>'
    + '</nav>';
}
function onTapNewEntry(){ if(appState.tab === 'form') return; goTab('form'); }

function renderHomeScreen(){
  let html = '<h2 class="home-title">Formulaires</h2>';
  html += '<div class="home-sub">Sélectionnez un formulaire.</div>';
  html += renderInstallBanner();
  const pending = totalPendingCount();
  if(pending){
    html += '<div class="conn-banner off">'+pending+' saisie'+(pending>1?'s':'')+' en attente d’envoi au total.</div>';
  }
  html += FORMS.map(f => {
    const hist = loadHistory(f.id);
    const pend = hist.filter(a=>a._status==='pending').length;
    const draft = loadDraft(f.id);
    const hasDraft = Object.keys(draft).some(k => draft[k] !== undefined && draft[k] !== '' && !(Array.isArray(draft[k]) && !draft[k].length));
    let meta = '';
    if(pend) meta += '<span class="badge pending">'+pend+' en attente</span>';
    else if(hist.length) meta += '<span class="badge ok">'+hist.length+'</span>';
    if(hasDraft) meta += '<span class="badge note">brouillon</span>';
    return '<div class="form-tile" onclick="selectForm(\''+f.id+'\')">'
      + '<div class="form-tile-emoji">'+f.emoji+'</div>'
      + '<div class="form-tile-text"><div class="form-tile-name">'+esc(f.name)+'</div><div class="form-tile-desc">'+esc(f.desc)+'</div></div>'
      + '<div class="form-tile-meta">'+meta+'<span class="form-tile-chevron">'+ICONS.chevron+'</span></div>'
      + '</div>';
  }).join('');
  return html;
}

function renderFormScreen(){
  const steps = currentSteps();
  const step = steps[appState.stepIndex];
  const isFirst = appState.stepIndex === 0;
  const isLast = appState.stepIndex === steps.length - 1;
  const missing = isLast ? requiredMissing() : [];
  // Formulaire sans récapitulatif : les champs obligatoires manquants sont signalés ici.
  const missingAlert = (isLast && step.kind !== 'review' && missing.length && appState.showMissing)
    ? '<div class="alert warn" style="margin-bottom:14px;"><strong>Champs obligatoires à remplir</strong><ul>'
      + missing.map(m => '<li>'+esc(m.label)+(m.stepIndex !== appState.stepIndex ? ' — <button class="link" onclick="jumpToStep('+m.stepIndex+')">compléter</button>' : '')+'</li>').join('') + '</ul></div>'
    : '';

  const body = missingAlert + '<div class="card">'
    + '<div class="step-eyebrow">'+step.eyebrow+'</div>'
    + '<h2 class="step-title">'+esc(step.title)+'</h2>'
    + (step.help ? '<div class="step-help">'+esc(step.help)+'</div>' : '')
    + '<div style="margin-top:16px;">' + renderStepBody(step) + '</div>'
    + '</div>';

  let nav = '<div class="stepnav">';
  nav += isFirst ? '<button class="btn btn-ghost" style="flex:0 0 46px;" disabled>'+ICONS.back+'</button>'
                 : '<button class="btn btn-ghost" style="flex:0 0 46px;" onclick="goStep(-1)">'+ICONS.back+'</button>';
  if(isLast) nav += '<button class="btn btn-primary btn-block" '+(missing.length && step.kind === 'review'?'disabled':'')+' onclick="submitEntry()">Envoyer</button>';
  else nav += '<button class="btn btn-primary btn-block" onclick="goStep(1)">Suivant</button>';
  nav += '</div>';

  return body + nav;
}

function statusBadge(a){
  if(a._status === 'sent') return '<span class="badge ok">Envoyé</span>';
  if(a._status === 'sending') return '<span class="badge pending">Envoi…</span>';
  return '<span class="badge pending">En attente</span>';
}
function renderEntryCard(form, a){
  const stats = statsFromPayload(form, a);
  const badBadge = stats.bad > 0 ? '<span class="badge warn">'+stats.bad+' à signaler</span>' : (stats.good ? '<span class="badge ok">OK</span>' : '');
  const label = entryLabel(form.steps, a) || fmtDateTime(a.submittedAt);
  return '<div class="audit-card" onclick="openDetail(\''+a._id+'\')">'
    + '<div class="audit-top"><div><div class="audit-chantier">'+esc(label)+'</div></div>'
    + '<div class="badges">'+statusBadge(a)+badBadge+'</div></div>'
    + '<div class="audit-meta"><span>'+fmtDate((a.date_audit||a.date_rex||a.fait_le||a.formalise_le||'').toString())+'</span></div>'
    + '</div>';
}

function renderListScreen(){
  const form = currentForm();
  const list = loadHistory(form.id);
  const pendingCount = list.filter(a => a._status === 'pending').length;
  let html = '<h2 class="screen-title">'+esc(form.name)+'</h2>';
  html += '<div class="screen-desc">'+list.length+' saisie'+(list.length>1?'s':'')+' sur cet appareil</div>';

  html += '<div class="conn-banner ' + (navigator.onLine ? 'on' : 'off') + '">'
    + (navigator.onLine ? 'Chaque envoi est transmis directement au tableau de bord SATREL / SITENOR (Google Sheets + PDF par e-mail).' : 'Hors connexion : les envois seront mis en attente puis renvoyés automatiquement.')
    + '</div>';
  if(pendingCount) html += '<div class="conn-banner off">'+pendingCount+' en attente d’envoi.</div>';

  html += '<button class="fab-new" onclick="startNewEntry()">'+ICONS.plus+' Nouvelle saisie</button>';
  if(hasAnyAnswer()){
    html += '<div class="banner local" style="cursor:pointer;" onclick="goTab(\'form\')">Brouillon en cours ('+countAnsweredSteps()+'/'+form.steps.filter(s => s.kind !== 'review').length+' étapes) — appuyer pour reprendre.</div>';
  }
  if(list.length === 0) html += '<div class="empty">'+ICONS.empty+'<p>Aucune saisie enregistrée pour l’instant.</p></div>';
  else html += list.map(a => renderEntryCard(form, a)).join('');
  return html;
}

function renderDetailScreen(){
  const form = currentForm();
  const list = loadHistory(form.id);
  const data = list.find(a => a._id === appState.detailId);
  if(!data) return '<div class="empty">'+ICONS.empty+'<p>Introuvable.</p></div>';

  let html = '<h2 class="screen-title">'+esc(entryLabel(form.steps, data) || form.name)+'</h2>';
  html += '<div class="screen-desc">'+esc(form.name)+'</div>';
  html += '<div style="margin-bottom:12px;">'+statusBadge(data)+'</div>';
  if(data._status === 'pending') html += '<button class="btn btn-primary btn-block" style="margin-bottom:10px;" onclick="resendOne(\''+data._id+'\')">Renvoyer maintenant</button>';
  html += '<button class="btn btn-ghost btn-block" style="margin-bottom:6px;" onclick=\'exportRecord(currentDetailData())\'>Copier le détail</button>';
  html += '<div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:6px;">Saisi le '+fmtDateTime(data.submittedAt)+'</div>';

  form.steps.forEach(step => {
    if(step.kind === 'review') return;
    let sectionHtml = '';
    if(step.kind === 'fields'){
      step.fields.forEach(f => {
        if(isDisplayOnly(f) || !isVisible(f, data)) return;
        if(f.type==='photos'){ if(Array.isArray(data[f.key]) && data[f.key].length) sectionHtml += '<div class="kv-row"><span class="k">'+esc(f.label)+'</span><span class="v">'+data[f.key].length+' photo(s)</span></div>'; return; }
        if(!hasValue(data[f.key])) return;
        const display = f.type === 'date' ? fmtDate(data[f.key]) : fieldDisplay(f, data);
        sectionHtml += '<div class="kv-row"><span class="k">'+esc(f.label)+'</span><span class="v">'+esc(display)+'</span></div>';
      });
    } else if(step.kind === 'grid' || step.kind === 'mixed'){
      const items = step.kind==='grid' ? step.items : step.grid.items;
      const options = step.kind==='grid' ? step.options : step.grid.options;
      const exclusive = step.kind==='grid' ? step.exclusive : step.grid.exclusive;
      if(step.kind==='mixed'){ step.fields.forEach(f => { const v=data[f.key]; if(Array.isArray(v)&&v.length) sectionHtml += '<div class="kv-row"><span class="k">'+esc(f.label)+'</span><span class="v">'+esc(v.join(', '))+'</span></div>'; }); }
      items.forEach(item => {
        let statusHtml;
        if(exclusive){
          const v = data[item.key]; if(!v) return;
          const bad = BAD_VALUES.has(v), neutral = NEUTRAL_VALUES.has(v);
          const bg = bad?'warn-soft':neutral?'so-soft':'ok-soft', fg = bad?'warn':neutral?'so':'ok';
          statusHtml = '<span class="chip-status" style="background:var(--'+bg+');color:var(--'+fg+');">'+esc(v)+'</span>';
        } else {
          const sel = options.filter(o=>data[item.key+'__'+o]); if(!sel.length) return;
          statusHtml = '<span class="chip-status" style="background:var(--accent-soft);color:var(--accent-soft-ink);">'+esc(sel.join(' + '))+'</span>';
        }
        sectionHtml += '<div class="kv-row"><span class="k">'+esc(item.label)+'</span><span class="v">'+statusHtml+'</span></div>';
      });
      (step.after || []).forEach(f => { if(isVisible(f, data) && hasValue(data[f.key])) sectionHtml += '<div class="kv-row"><span class="k">'+esc(f.label)+'</span><span class="v">'+esc(fieldDisplay(f, data))+'</span></div>'; });
      if(data[step.commentKey]) sectionHtml += '<div class="detail-comment">'+esc(data[step.commentKey])+'</div>';
    } else if(step.kind === 'grids'){
      step.groups.forEach(g => {
        let gh = '';
        g.items.forEach(item => {
          const v = data[item.key]; if(!v) return;
          const bad = BAD_VALUES.has(v), neutral = NEUTRAL_VALUES.has(v);
          const bg = bad?'warn-soft':neutral?'so-soft':'ok-soft', fg = bad?'warn':neutral?'so':'ok';
          gh += '<div class="kv-row"><span class="k">'+esc(item.label)+'</span><span class="v"><span class="chip-status" style="background:var(--'+bg+');color:var(--'+fg+');">'+esc(v)+'</span></span></div>';
        });
        if(gh) sectionHtml += '<h4 style="font-size:13.5px;margin:12px 0 2px;color:var(--accent);">'+esc(g.title)+'</h4>'+gh;
      });
    } else if(step.kind === 'scale'){
      step.items.forEach(item => { if(data[item.key]) sectionHtml += '<div class="kv-row"><span class="k">'+esc(item.label)+'</span><span class="v mono">'+data[item.key]+'/5</span></div>'; });
      if(data[step.commentKey]) sectionHtml += '<div class="detail-comment">'+esc(data[step.commentKey])+'</div>';
    } else if(step.kind === 'scale-single'){
      if(data[step.key]) sectionHtml += '<div class="kv-row"><span class="k">'+esc(step.label)+'</span><span class="v mono">'+data[step.key]+'/5</span></div>';
      if(data[step.commentKey]) sectionHtml += '<div class="detail-comment">'+esc(data[step.commentKey])+'</div>';
    } else if(step.kind === 'info-scale'){
      if(data[step.scaleKey]) sectionHtml += '<div class="kv-row"><span class="k">'+esc(step.scaleLabel)+'</span><span class="v mono">'+data[step.scaleKey]+'/5</span></div>';
    } else if(step.kind === 'rated-list' || step.kind === 'mixed-rated'){
      const items = step.kind==='rated-list' ? step.items : step.rated.items;
      items.forEach(item => {
        const v = data[item.key]; if(!v) return;
        const bad = BAD_VALUES.has(v), neutral = NEUTRAL_VALUES.has(v);
        const bg = bad?'warn-soft':neutral?'so-soft':'ok-soft', fg = bad?'warn':neutral?'so':'ok';
        sectionHtml += '<div class="kv-row"><span class="k">'+esc(item.label)+'</span><span class="v"><span class="chip-status" style="background:var(--'+bg+');color:var(--'+fg+');">'+esc(v)+'</span></span></div>';
        if(data[item.commentKey]) sectionHtml += '<div class="detail-comment">'+esc(data[item.commentKey])+'</div>';
      });
      if(step.kind==='mixed-rated') step.fields.forEach(f => { if(data[f.key]) sectionHtml += '<div style="margin-top:8px;"><div class="k" style="font-size:12.5px;color:var(--ink-dim);margin-bottom:4px;">'+esc(f.label)+'</div><div class="detail-comment" style="margin-top:0;">'+esc(data[f.key])+'</div></div>'; });
    }
    if(sectionHtml) html += '<div class="card"><h3 class="step-title" style="font-size:18px;">'+esc(step.title)+'</h3>'+sectionHtml+'</div>';
  });

  return html;
}
function currentDetailData(){ return loadHistory(appState.formId).find(a => a._id === appState.detailId); }

function render(){
  const app = document.getElementById('app');
  let view = '';
  if(!appState.formId) view = renderHomeScreen();
  else if(appState.tab === 'form') view = renderFormScreen();
  else if(appState.tab === 'detail') view = renderDetailScreen();
  else view = renderListScreen();

  app.innerHTML = renderAppBar()
    + '<main id="view">' + view + '</main>'
    + renderTabBar()
    + (appState.toast ? '<div class="toast">'+esc(appState.toast)+'</div>' : '')
    + renderExportModal();

  document.querySelectorAll('#view textarea').forEach(autoGrow);
}

/* ---------- Installation (PWA) ---------- */
let deferredInstall = null;
const IS_NATIVE = !!window.Capacitor || location.protocol === 'capacitor:' || (location.hostname === 'localhost' && location.protocol === 'https:');
function isStandalone(){ return IS_NATIVE || window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; render(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; render(); });
async function installApp(){
  if(!deferredInstall) return;
  deferredInstall.prompt();
  await deferredInstall.userChoice;
  deferredInstall = null; render();
}
function renderInstallBanner(){
  if(isStandalone()) return '';
  if(deferredInstall){
    return '<div class="conn-banner on" style="justify-content:space-between;"><span>Installez l’application sur votre téléphone.</span>'
      + '<button class="btn btn-primary btn-sm" onclick="installApp()">Installer</button></div>';
  }
  if(/iphone|ipad|ipod/i.test(navigator.userAgent)){
    return '<div class="banner local">Pour installer l’application : touchez le bouton Partager puis « Sur l’écran d’accueil ».</div>';
  }
  return '';
}
if(!IS_NATIVE && 'serviceWorker' in navigator && location.protocol.startsWith('http')){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}

render();
if(navigator.onLine) retryPendingAll();
</script>
</body>
</html>
